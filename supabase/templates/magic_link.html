<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 420px; margin: 0 auto; padding: 32px 24px; color: #171717;">
  <p style="font-size: 16px; margin: 0 0 24px;">Your sign-in code for <strong>Self</strong>:</p>

  <p style="font-size: 36px; font-weight: 700; letter-spacing: 0.15em; text-align: center; margin: 0 0 24px; padding: 20px; background: #fafafa; border-radius: 12px;">
    {{ .Token }}
  </p>

  <p style="font-size: 14px; color: #737373; margin: 0 0 24px;">
    Enter this code in the app. It expires in 1 hour.
  </p>

  <p style="font-size: 13px; color: #a3a3a3; margin: 0;">
    On a computer, you can also just click this link instead:
    <a href="{{ .ConfirmationURL }}" style="color: #171717;">Sign in</a>
  </p>
</div>
